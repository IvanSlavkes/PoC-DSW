<form [formGroup]="tareaForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-3 p-6">
  <h3 class="font-bold text-2xl">
    {{ tareaAEditar() ? 'Editar Tarea' : 'Nueva Tarea' }}
  </h3>

  <label class="flex flex-col">
    Nombre
    <input type="text" formControlName="nombre" class="border rounded p-2 w-full" />
  </label>
  @if (tareaForm.get('nombre')?.invalid && tareaForm.get('nombre')?.touched) {
  <span class="text-red-500 text-sm">El nombre es obligatorio</span>
  }

  <label class="flex flex-col">
    Descripción
    <textarea formControlName="descripcion" class="border rounded p-2 w-full"></textarea>
  </label>


  <div class="flex gap-2 mt-2">
    <button type="submit" [disabled]="tareaForm.invalid"
      class="bg-blue-600 text-white rounded p-2 flex-1 disabled:opacity-50">
      Guardar
    </button>
    <button type="button" (click)="onCancelar()" class="bg-gray-300 rounded p-2 flex-1">
      Cancelar
    </button>
  </div>
</form>
