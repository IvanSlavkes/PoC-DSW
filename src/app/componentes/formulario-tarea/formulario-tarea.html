<div class="lista-tareas">
  <h2 class="font-bold text-4xl px-6 py-4">Mis Tareas</h2>

  @if (tareas().length === 0) {
  <p>No hay tareas cargadas todavía.</p>
  } 
  @else {
    <ul class="">
      @for (tarea of tareas(); track tarea.id) {
        <li [class]="tarea.estado === 'pendiente' ? 'bg-yellow-500' : 'bg-green-600'" class="align-middle p-5 mx-4 my-3 rounded-3xl">
          <span class="flex justify-between items-center my-1">
            <strong class="text-2xl"> {{tarea.nombre}}</strong> 
            <span class="capitalize w-auto">{{ tarea.estado }}</span>
          </span>
          @if (tarea.descripcion) {
            
            <span class="flex mt-3">{{ tarea.descripcion }}</span>

            } @else {
              <span class="flex mt-3 italic">Sin Descripción</span>
            }
        </li>
      }
    </ul>
  }
</div>
