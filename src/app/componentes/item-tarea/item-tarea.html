<li [class]="tarea().estado === 'pendiente' ? 'bg-yellow-500' : 'bg-green-600'"
  class="align-middle p-5 mx-4 my-3 rounded-3xl h-auto">
  <span class="flex justify-between items-center my-1">
    <strong class="text-2xl">{{ tarea().nombre }}</strong>
    <span class="font-bold capitalize w-auto">{{ tarea().estado }}</span>
  </span>

  @if (tarea().descripcion) {
  <span class="flex mt-3">{{ tarea().descripcion }}</span>
  } @else {
  <span class="flex mt-3 italic">Sin Descripción</span>
  }

  <div class="flex gap-2 mt-4">
    <button (click)="onEditar()" class="bg-blue-600 text-white rounded px-3 py-1">
      Editar
    </button>
    <button (click)="onEliminar()" class="bg-red-600 text-white rounded px-3 py-1">
      Eliminar
    </button>
    <button (click)="onCambiarEstado()" class="bg-green-800 text-white rounded px-3 py-1"  [class]="tarea().estado === 'completada' ? 'bg-yellow-500' : 'bg-green-600'">
      @if(tarea().estado === 'completada'){
        <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
        </svg>
      } @else {
        <svg xmlns="http://w3.org" viewBox="0 0 24 24" fill="currentColor" class="size-5">
          <path fill-rule="evenodd"
            d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12Zm13.36-1.814a.75.75 0 1 0-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 0 0-1.06 1.06l2.25 2.25a.75.75 0 0 0 1.14-.094l3.75-5.25Z"
            clip-rule="evenodd" />
        </svg>
      }
    </button>
  </div>
</li>
